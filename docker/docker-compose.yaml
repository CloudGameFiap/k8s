services:
  paymentapi:
    image: igordeandradetudisco/payment-api:2
    container_name: cloudgame-paymentapi
    depends_on:
      rabbitmq:
        condition: service_healthy
    ports:
      - '8082:8080'
      - '8083:8081'
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__CloudGameDb=${ConnectionStrings__PaymentsApi}
      # RabbitMQ Settings
      - RabbitMq__Host=${RabbitMq__Host}
      - RabbitMq__Port=${RabbitMq__Port}
      - RabbitMq__Username=${RabbitMq__Username}
      - RabbitMq__Password=${RabbitMq__Password}
      - MSSQL_SA_PASSWORD=${SA_PASSWORD}
    networks:
      - cloudgame-network

  notificationapi:
    image: igordeandradetudisco/cloudgamefiapnotificationapi:2
    container_name: cloudgame-notificationapi
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - RabbitMq__Host=${RabbitMq__Host}
      - RabbitMq__Port=${RabbitMq__Port}
      - RabbitMq__Username=${RabbitMq__Username}
      - RabbitMq__Password=${RabbitMq__Password}
    networks:
      - cloudgame-network

  catalogapi:
    image: igordeandradetudisco/cloudgamefiapcatalogapi:2 
    container_name: cloudgame-catalogapi
    depends_on:
      rabbitmq:
        condition: service_healthy
      sqlserver:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    ports:
      - '57398:8080'
      - '57399:8081'
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      # Logging Settings
      - Logging__LogLevel__Default= "Information"
      - Logging__LogLevel__Microsoft.Hosting.Lifetime= "Information"
      # Database connection string
      - ConnectionStrings__Default=${ConnectionStrings__CatalogApi}
      # MongoDbCache Cache Settings
      - MongoDbCache__ConnectionString=${MongoDbCache__ConnectionString}
      - MongoDbCache__DatabaseName=${MongoDbCache__DatabaseName}
      - MongoDbCache__CollectionName=${MongoDbCache__CollectionName}
      # RabbitMQ Settings
      - RabbitMq__Host=${RabbitMq__Host}
      - RabbitMq__Port=${RabbitMq__Port}
      - RabbitMq__Username=${RabbitMq__Username}
      - RabbitMq__Password=${RabbitMq__Password}
      # Default User data
      - AppDefaultUserAdmin__Email=${AppDefaultUserAdmin__Email}
      - AppDefaultUserAdmin__Password=${AppDefaultUserAdmin__Password}
      - AppDefaultUserAdmin__Name=${AppDefaultUserAdmin__Name}
      # Serilog
      - Serilog__MinimumLevel__Default=${Serilog__MinimumLevel__Default}
      - Serilog__MinimumLevel__Override__System=${Serilog__MinimumLevel__Override__System}
      - Serilog__WriteTo__0__Name=${Serilog__WriteTo__0__Name}
      - Serilog__WriteTo__1__Name=${Serilog__WriteTo__1__Name}
      - Serilog__WriteTo__1__Args__path=${Serilog__WriteTo__1__Args__path}
      - Serilog__WriteTo__1__Args__rollingInterval=${Serilog__WriteTo__1__Args__rollingInterval}
      - Serilog__WriteTo__1__Args__retainedFileCountLimit=${Serilog__WriteTo__1__Args__retainedFileCountLimit}
      - Serilog__WriteTo__1__Args__outputTemplate=${Serilog__WriteTo__1__Args__outputTemplate}
      - Serilog__Enrich__0=${Serilog__Enrich__0}
      - Serilog__Enrich__1=${Serilog__Enrich__1}
      - Serilog__Enrich__2=${Serilog__Enrich__2}
    networks:
      - cloudgame-network

  catalogconsumer:
    image: igordeandradetudisco/cloudgamefiapcatalogconsumer:2
    container_name: cloudgame-consumer
    depends_on:
      rabbitmq:
        condition: service_healthy
      sqlserver:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    environment:
      # Logging Settings
      - Logging__LogLevel__Default= "Information"
      - Logging__LogLevel__Microsoft.Hosting.Lifetime= "Information"
      # Database connection string
      - ConnectionStrings__Default= ${ConnectionStrings__CatalogApi}
      # MongoDB Cache
      - MongoDbCache__ConnectionString=${MongoDbCache__ConnectionString}
      - MongoDbCache__DatabaseName=${MongoDbCache__DatabaseName}
      - MongoDbCache__CollectionName=${MongoDbCache__CollectionName}
      # RabbitMQ Settings
      - RabbitMq__Host= ${RabbitMq__Host}
      - RabbitMq__Port= ${RabbitMq__Port}
      - RabbitMq__Username= ${RabbitMq__Username}
      - RabbitMq__Password= ${RabbitMq__Password}
      # Default User data
      - AppDefaultUserAdmin__Email= ${AppDefaultUserAdmin__Email}
      - AppDefaultUserAdmin__Password= ${AppDefaultUserAdmin__Password}
      - AppDefaultUserAdmin__Name= ${AppDefaultUserAdmin__Name}
      # Serilog
      - Serilog__MinimumLevel__Default= ${Serilog__MinimumLevel__Default}
      - Serilog__MinimumLevel__Override__Microsoft= ${Serilog__MinimumLevel__Override__Microsoft}
      - Serilog__MinimumLevel__Override__System= ${Serilog__MinimumLevel__Override__System}
      - Serilog__WriteTo__0__Name= ${Serilog__WriteTo__0__Name}
      - Serilog__WriteTo__1__Name= ${Serilog__WriteTo__1__Name}
      - Serilog__WriteTo__1__Args__path= ${Serilog__WriteTo__1__Args__path}
      - Serilog__WriteTo__1__Args__rollingInterval= ${Serilog__WriteTo__1__Args__rollingInterval}
      - Serilog__WriteTo__1__Args__retainedFileCountLimit= ${Serilog__WriteTo__1__Args__retainedFileCountLimit}
      - Serilog__WriteTo__1__Args__outputTemplate= ${Serilog__WriteTo__1__Args__outputTemplate}
      - Serilog__Enrich__0= ${Serilog__Enrich__0}
      - Serilog__Enrich__1= ${Serilog__Enrich__1}
      - Serilog__Enrich__2= ${Serilog__Enrich__2}
    networks:
      - cloudgame-network

  userapi:
    image: igordeandradetudisco/cloudgamefiapuserapi:2
    container_name: cloudgame-userapi
    depends_on:
      rabbitmq:
        condition: service_healthy
      sqlserver:
        condition: service_healthy
    ports:
      - '7037:8080'
      - '7038:8081'
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - Logging__LogLevel__Default=Information
      - Logging__LogLevel__Microsoft.Hosting.Lifetime=Information
      - JwtSettings__EncriptKey=${JwtSettings__EncriptKey}
      - JwtSettings__Audience=${JwtSettings__Audience}
      - JwtSettings__Issuer=${JwtSettings__Issuer}
      - JwtSettings__ExpiresInMinutes=${JwtSettings__ExpiresInMinutes}
      - ConnectionStrings__Default=${ConnectionStrings__UserApi}
      # RabbitMQ Settings
      - RabbitMq__Host=${RabbitMq__Host}
      - RabbitMq__Port=${RabbitMq__Port}
      - RabbitMq__Username=${RabbitMq__Username}
      - RabbitMq__Password=${RabbitMq__Password}
      # Default User data
      - AppDefaultUserAdmin__Email=${AppDefaultUserAdmin__Email}
      - AppDefaultUserAdmin__Password=${AppDefaultUserAdmin__Password}
      - AppDefaultUserAdmin__Name=${AppDefaultUserAdmin__Name}
      # Serilog
      - Serilog__MinimumLevel__Default=${Serilog__MinimumLevel__Default}
      - Serilog__MinimumLevel__Override__Microsoft=${Serilog__MinimumLevel__Override__Microsoft}
      - Serilog__MinimumLevel__Override__System=${Serilog__MinimumLevel__Override__System}
      - Serilog__WriteTo__0__Name=${Serilog__WriteTo__0__Name}
      - Serilog__WriteTo__1__Name=${Serilog__WriteTo__1__Name}
      - Serilog__WriteTo__1__Args__path=${Serilog__WriteTo__1__Args__path}
      - Serilog__WriteTo__1__Args__rollingInterval=${Serilog__WriteTo__1__Args__rollingInterval}
      - Serilog__WriteTo__1__Args__retainedFileCountLimit=${Serilog__WriteTo__1__Args__retainedFileCountLimit}
      - Serilog__WriteTo__1__Args__outputTemplate=${Serilog__WriteTo__1__Args__outputTemplate}
      - Serilog__Enrich__0=${Serilog__Enrich__0}
      - Serilog__Enrich__1=${Serilog__Enrich__1}
      - Serilog__Enrich__2=${Serilog__Enrich__2}
    networks:
      - cloudgame-network

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: cloudgame-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=${SA_PASSWORD}
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    networks:
      - cloudgame-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: cloudgame-rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=${RabbitMq__Username}
      - RABBITMQ_DEFAULT_PASS=${RabbitMq__Password}
      - RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS=-rabbit vm_memory_high_watermark 0.8
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - cloudgame-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:8
    container_name: cloudgame-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: ${MongoDbCache__DatabaseName}
      MONGO_INITDB_ROOT_USERNAME: ${MongoDbCache__USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MongoDbCache__Password}
    command: ["mongod", "--bind_ip_all", "--auth"]
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    networks:
      - cloudgame-network
    healthcheck:
      test:
        ["CMD", "mongosh", "-u", "${MongoDbCache__USER}", "-p", "${MongoDbCache__Password}", "--authenticationDatabase", "admin", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  sqlserver-data:
  rabbitmq-data:
  mongodb-data:

networks:
  cloudgame-network:
    name: cloudgame-network
    driver: bridge