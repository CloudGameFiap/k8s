apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3-management-alpine
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              memory: "512Mi"  # Aumentado para dar mais folga no boot
              cpu: "250m"
            limits:
              memory: "1Gi"    # Recomendado aumentar para evitar OOMKilled precoce
              cpu: "500m"
          ports:
            - name: amqp
              containerPort: 5672
            - name: management
              containerPort: 15672
          env:        
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef:
                  name: infra-secret
                  key: RabbitMQ__Username
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: infra-secret
                  key: RabbitMQ__Password
            # IMPORTANTE: Faz o RabbitMQ calcular o limite baseado no limite do cgroup do K8s
            - name: RABBITMQ_MEM_LIMIT_ABSOLUTE
              value: "1073741824" # 1Gi em Bytes (Sempre use o mesmo valor do limit de memória)
          readinessProbe:
            exec:
              command:
                - rabbitmq-diagnostics
                - -q
                - ping
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - rabbitmq-diagnostics
                - -q
                - ping
            initialDelaySeconds: 40
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
spec:
  type: ClusterIP
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
    - name: management
      port: 15672
      targetPort: 15672