apiVersion: v1
kind: Namespace
metadata:
  name: amazon-cloudwatch
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudgame-prometheus-config
  namespace: amazon-cloudwatch
data:
  prometheus.yaml: |
    global:
      scrape_interval: 15s
      scrape_timeout: 10s
    scrape_configs:
      - job_name: user-api
        metrics_path: /metrics
        static_configs:
          - targets: ["user-api.default.svc.cluster.local:80"]
      - job_name: catalog-api
        metrics_path: /metrics
        static_configs:
          - targets: ["catalog-api.default.svc.cluster.local:80"]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudgame-cwagent-config
  namespace: amazon-cloudwatch
data:
  cwagentconfig.json: |
    {
      "logs": {
        "metrics_collected": {
          "prometheus": {
            "prometheus_config_path": "/etc/prometheusconfig/prometheus.yaml",
            "emf_processor": {
              "metric_declaration": [
                {
                  "source_labels": ["job"],
                  "label_matcher": "^(user-api|catalog-api)$",
                  "dimensions": [["ClusterName", "job"]],
                  "metric_selectors": ["^http_requests_received_total$"]
                },
                {
                  "source_labels": ["job", "code"],
                  "label_matcher": "^(user-api|catalog-api);[1-5][0-9][0-9]$",
                  "dimensions": [["ClusterName", "job", "code"]],
                  "metric_selectors": ["^http_requests_received_total$"]
                }
              ]
            }
          }
        },
        "force_flush_interval": 5
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudgame-cwagent-prometheus
  namespace: amazon-cloudwatch
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudgame-cwagent-prometheus
  template:
    metadata:
      labels:
        app: cloudgame-cwagent-prometheus
    spec:
      serviceAccountName: cloudwatch-agent
      terminationGracePeriodSeconds: 60
      containers:
        - name: cloudwatch-agent
          image: public.ecr.aws/cloudwatch-agent/cloudwatch-agent:1.300074.0b1920
          imagePullPolicy: IfNotPresent
          env:
            - name: CI_VERSION
              value: "k8s/1.3.51"
          resources:
            requests:
              cpu: 200m
              memory: 200Mi
            limits:
              cpu: 1000m
              memory: 1000Mi
          volumeMounts:
            - name: cwagent-config
              mountPath: /etc/cwagentconfig
            - name: prometheus-config
              mountPath: /etc/prometheusconfig
      volumes:
        - name: cwagent-config
          configMap:
            name: cloudgame-cwagent-config
        - name: prometheus-config
          configMap:
            name: cloudgame-prometheus-config
