apiVersion: configuration.konghq.com/v1
kind: KongPlugin
metadata:
  name: jwt-auth
plugin: jwt
config:
  claims_to_verify:
    - exp
---
apiVersion: configuration.konghq.com/v1
kind: KongPlugin
metadata:
  name: rate-limit-60
plugin: rate-limiting
config:
  minute: 60
  policy: local
---
apiVersion: configuration.konghq.com/v1
kind: KongPlugin
metadata:
  name: rate-limit-login
plugin: rate-limiting
config:
  minute: 2
  policy: local
  limit_by: ip
  fault_tolerant: true
  hide_client_headers: false
---
apiVersion: configuration.konghq.com/v1
kind: KongPlugin
metadata:
  name: cors-allow
plugin: cors
config:
  origins:
    - "*"
  methods: [GET, POST, PUT, DELETE, OPTIONS]
  headers: [Accept, Authorization, Content-Type]
  credentials: true

# admin-only removido: a checagem de role "admin" passa a ser feita
# inteiramente pela CatalogAPI via RequireAuthorization("admin")
# (policy configurada com policy.RequireRole("admin") no AddAuthorization).
#
# Na rota/Ingress do POST e PUT de /api/games, mantenha só:
#   konghq.com/plugins: jwt-auth,cors-allow,rate-limit-60
# removendo "admin-only" da lista de plugins anexados.